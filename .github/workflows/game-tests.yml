name: Game Tests
on:
  push:
    branches: [main]
    paths:
      - 'game/**'
      - 'data/**'
      - '.github/workflows/game-tests.yml'
  pull_request:
    paths:
      - 'game/**'
      - 'data/**'
      - '.github/workflows/game-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run game unit and integration tests
        working-directory: game
        run: npm test
