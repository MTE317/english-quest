<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>English Quest</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <header class="bar"><h1>English Quest（作りかけ）</h1></header>
    <p class="muted">いまは動作確認用の画面だけがあります。</p>
    <a class="btn primary" href="town.html">町</a>
    <a class="btn" href="dungeon.html">ダンジョン</a>
    <a class="btn" href="party.html">パーティ</a>
    <a class="btn" href="quiz.html">ルーンの問題（10問）</a>
    <a class="btn" href="save.html">セーブの確認</a>
    <a class="btn" href="data.html">データ確認</a>
    <p id="save-status" class="muted small"></p>
  </main>
  <script type="module">
    import { GameSession } from './js/save.js';
    const s = new GameSession();
    const line = document.getElementById('save-status');
    if (!s.hasSave) line.textContent = 'セーブ：なし';
    else line.textContent = `セーブ：あり（${s.inDungeon ? 'ダンジョンの途中' : '町'}・最後に保存 ${new Date(s.state.savedAt).toLocaleString('ja-JP')}）`;
  </script>
</body>
</html>
