<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>開発用メニュー - English Quest</title>
  <link rel="stylesheet" href="css/style.css?v=rune-study-1">
</head>
<body>
  <main class="app">
    <header class="bar"><a class="back" href="index.html">← 町へ</a><h1>開発用メニュー</h1></header>
    <a class="btn" href="party.html?debug">パーティーの動作確認</a>
    <a class="btn" href="dungeon.html?debug">遠征の動作確認</a>
    <a class="btn" href="status-debug.html">全員の状態異常を試す</a>
    <a class="btn" href="quiz.html">ルーンの問題（動作確認）</a>
    <a class="btn" href="save.html">セーブの確認</a>
    <a class="btn" href="data.html">データ確認</a>
    <p id="save-status" class="muted small"></p>
    <section class="panel">
      <h2>パーティーの育成（開発用）</h2>
      <p class="small muted">町にいるときだけ使えます。確認後、現在のセーブに反映します。</p>
      <button id="debug-party-max" type="button" disabled>全員をLv99・現職AP999に設定</button>
      <p id="debug-party-status" class="small" role="status"></p>
    </section>
    <details class="panel">
      <summary>セーブを初期化する</summary>
      <p class="small muted">パーティー・持ち物・ダンジョンの進行を消して、最初から始められます。</p>
      <label class="small"><input id="reset-learning" type="checkbox"> 学習記録も消す</label>
      <button id="reset-game" type="button" class="ghost error">初期化する</button>
      <div id="reset-status" class="small" role="status"></div>
    </details>
  </main>
  <script type="module">
    import { GameSession } from './js/save.js?v=features-2';
    import { LearningStore, safeStorage, setDebugDayOffset } from './js/storage.js?v=features-2';
    import { loadGameData } from './js/gamedata.js?v=rune-study-1';
    import { canDebugParty, confirmDebugParty } from './js/debug-party.js?v=party-max-1';
    const boost = document.getElementById('debug-party-max');
    const boostStatus = document.getElementById('debug-party-status');
    let data;
    const storage = safeStorage();
    const s = new GameSession({ storage });
    const line = document.getElementById('save-status');
    const resetLearning = document.getElementById('reset-learning');
    const resetStatus = document.getElementById('reset-status');

    function showSaveStatus() {
      boost.disabled = !storage || !canDebugParty(data, s);
      line.textContent = s.hasSave
        ? `セーブ：あり（${s.inDungeon ? 'ダンジョンの途中' : '町'}・最後に保存 ${new Date(s.state.savedAt).toLocaleString('ja-JP')}）`
        : 'セーブ：なし';
    }

    boost.addEventListener('click', () => {
      try { boostStatus.textContent = confirmDebugParty(data, s, message => window.confirm(message)); }
      catch (error) { boostStatus.textContent = `設定できませんでした。${error.message}`; }
      showSaveStatus();
    });
    loadGameData().then(loaded => { data = loaded; showSaveStatus(); }).catch(error => {
      boostStatus.textContent = `データを読み込めませんでした。${error.message}`;
    });

    document.getElementById('reset-game').addEventListener('click', () => {
      const includeLearning = resetLearning.checked;
      const target = includeLearning ? 'ゲームの進行と学習記録' : 'ゲームの進行';
      if (!confirm(`${target}を初期化しますか？ 消去したデータは元に戻せません。ほかに開いているゲームのタブがあれば、閉じてから実行してください。`)) return;
      try {
        if (!storage) throw new Error('ブラウザーの保存領域を使用できません。');
        s.deleteSave({ includeLearning });
        if (includeLearning) {
          new LearningStore(storage).clear();
          setDebugDayOffset(0, storage);
        }
        resetLearning.checked = false;
        resetStatus.textContent = `${target}を初期化しました。パーティーを作って開始できます。`;
      } catch (error) {
        resetStatus.textContent = `初期化を完了できませんでした。${error.message}`;
      }
      showSaveStatus();
    });

    window.addEventListener('pageshow', (event) => {
      if (!event.persisted) return;
      s.load();
      showSaveStatus();
    });
    showSaveStatus();
  </script>
</body>
</html>
